version: 2
updates:
- package-ecosystem: uv
  directory: /
  schedule:
    interval: cron
    cronjob: 37 4 * * *
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  versioning-strategy: increase-if-necessary
  allow:
  - dependency-name: costs
    dependency-type: all
  - dependency-name: dsl2tillm
    dependency-type: all
  - dependency-name: env2llm
    dependency-type: all
  - dependency-name: goal
    dependency-type: all
  - dependency-name: nlp2tillm
    dependency-type: all
  - dependency-name: planfile
    dependency-type: all
  - dependency-name: testql
    dependency-type: all
  - dependency-name: tillm
    dependency-type: all
  groups:
    internal-packages:
      patterns:
      - costs
      - dsl2tillm
      - env2llm
      - goal
      - nlp2tillm
      - planfile
      - testql
      - tillm
  commit-message:
    prefix: "chore(deps)"
